<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account - Snippy AI Web Organizer</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-color: #f0f7fb;
  --surface-color: #ffffff;
  --text-primary: #1a365d;
  --text-secondary: #4a5568;
  --accent-color: #3b82f6;
  --accent-hover: #2563eb;
  --border-color: #e2e8f0;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-secondary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background-color: var(--surface-color);
  border-right: 1px solid var(--border-color);
  padding: 2rem;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  box-sizing: border-box;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 2.5rem;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #60a5fa, #3b82f6);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
}

.nav-menu {
  list-style: none;
  padding: 0;
  margin: 0;
}

.nav-item {
  margin-bottom: 0.5rem;
}

.nav-link {
  display: block;
  padding: 0.75rem 1rem;
  color: var(--text-secondary);
  text-decoration: none;
  border-radius: 8px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.nav-link:hover {
  background-color: #eff6ff;
  color: var(--accent-color);
}

.nav-link.active {
  background-color: #eff6ff;
  color: var(--accent-color);
  font-weight: 600;
}

.main-content {
  flex: 1;
  margin-left: 260px;
  padding: 3rem;
  display: flex;
  justify-content: center;
}

.policy-wrapper {
  max-width: 800px;
  width: 100%;
}

.policy-card {
  background: var(--surface-color);
  padding: 4rem;
  border-radius: 20px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
}

h1, h2, h3, h4 {
  color: var(--text-primary);
  margin-top: 2.5rem;
  margin-bottom: 1rem;
}

h1 {
  font-size: 2.5rem;
  letter-spacing: -0.02em;
  margin-top: 0;
  margin-bottom: 0.5rem;
}

h2 {
  font-size: 1.5rem;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
}

h3 {
  font-size: 1.25rem;
}

p {
  margin-bottom: 1.25rem;
}

ul {
  margin-bottom: 1.25rem;
  padding-left: 1.5rem;
}

li {
  margin-bottom: 0.5rem;
}

a {
  color: var(--accent-color);
  text-decoration: none;
  transition: color 0.2s ease;
}

a:hover {
  color: var(--accent-hover);
  text-decoration: underline;
}

hr {
  border: 0;
  border-top: 1px solid var(--border-color);
  margin: 3rem 0;
}

strong {
  color: var(--text-primary);
}

code {
  background: #f1f5f9;
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  font-size: 0.875em;
  color: #ef4444;
}

.highlight-box {
  background: #eff6ff;
  border-left: 4px solid var(--accent-color);
  padding: 1rem 1.5rem;
  border-radius: 0 8px 8px 0;
  margin: 1.5rem 0;
}

@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border-color);
    padding: 1.5rem;
  }
  .brand {
    margin-bottom: 1.5rem;
  }
  .nav-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .nav-item {
    margin-bottom: 0;
  }
  .main-content {
    margin-left: 0;
    padding: 1.5rem;
  }
  .policy-card {
    padding: 2rem;
  }
  h1 {
    font-size: 2rem;
  }
}
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <img src="../app-logo.png" alt="Snippy Logo" class="brand-icon" style="background: none; object-fit: contain;" />
                Snippy
            </div>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="../privacy/index.html" class="nav-link">Privacy Policy</a>
                    </li>
                    <li class="nav-item">
                        <a href="../terms/index.html" class="nav-link">Terms of Service</a>
                    </li>
                    <li class="nav-item">
                        <a href="../delete-account/index.html" class="nav-link active">Delete Account</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="policy-wrapper">
                <div class="policy-card">
                    <h1>Delete Account</h1>
                    <p>Details and instructions for account deletion will be provided here.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
